name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Every library with code (libraries/<Name>/src/init.luau), as a JSON array for the
  # matrices below. Scaffolded libraries without code yet are left out.
  libraries:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4

      - id: list
        run: echo "list=$(ls libraries/*/src/init.luau | cut -d/ -f2 | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  test:
    needs: libraries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        library: ${{ fromJson(needs.libraries.outputs.list) }}
    defaults:
      run:
        working-directory: libraries/${{ matrix.library }}
    steps:
      - uses: actions/checkout@v4

      - name: Install lest (version pinned in the library's ember.toml)
        run: |
          version=$(sed -n 's|^lest = "lest-luau/lest@\(.*\)"|\1|p' ember.toml)
          curl -fsSL "https://github.com/lest-luau/lest/releases/download/v$version/lest-$version-linux-x86_64.zip" -o "$RUNNER_TEMP/lest.zip"
          unzip -q "$RUNNER_TEMP/lest.zip" -d "$RUNNER_TEMP/lest"
          chmod +x "$RUNNER_TEMP/lest/lest"
          echo "$RUNNER_TEMP/lest" >> "$GITHUB_PATH"

      # Packages from other indices, like Region's Bolt, are installed in Packages by
      # embr. The every/* libraries are left out: the tests find them next to this one
      - name: Install packages from other indices
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -q 'index = "' ember.toml || exit 0
          curl -fsSL "https://github.com/ember-luau/ember/releases/download/v0.6.0/embr-linux-x86_64.zip" -o "$RUNNER_TEMP/embr.zip"
          unzip -q "$RUNNER_TEMP/embr.zip" -d "$RUNNER_TEMP/embr"
          chmod +x "$RUNNER_TEMP/embr/embr"
          sed -i '/= { name = "every\//d' ember.toml
          "$RUNNER_TEMP/embr/embr" install

      - run: lest

  docs:
    needs: libraries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        library: ${{ fromJson(needs.libraries.outputs.list) }}
    defaults:
      run:
        working-directory: libraries/${{ matrix.library }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npx --yes @metricsrb/fumablox@1 check

  update-site:
    needs: [test, docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild the documentation site
        env:
          GH_TOKEN: ${{ secrets.DOCS_TOKEN }}
          SITE: ${{ github.repository_owner }}/${{ github.repository_owner }}.github.io
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::DOCS_TOKEN is not set, the documentation site was not rebuilt"
            exit 0
          fi
          gh api "repos/$SITE/dispatches" -f event_type=library-updated
