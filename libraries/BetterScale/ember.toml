[package]
name = "every/better-scale"
version = "0.0.1"
description = "BetterScale scales a UIScale with the size of its gui, configured with attributes."
authors = []
repository = "every-luau/every"
license = "MIT"

[target]
environment = "shared"
main = "src/init.luau"
includes = ["src", "default.project.json", "README.md", "LICENSE"]

[dependencies]
Void = { name = "every/void", version = "^0.0.1" }
# Signal = { name = "every/signal", version = "^0.0.1" }

[tools]
lest = "lest-luau/lest@0.6.0"
rojo = "rojo-rbx/rojo@7.7.0"

[scripts]
test = "lest"
