name = "every/bootstrap"
version = "0.1.0"
description = "Requires ModuleScripts and calls their hooks in order of priority."
authors = []
repository = "https://github.com/every-luau/every"
license = "MIT"
includes = ["src", "default.project.json", "pesde.toml", "README.md", "LICENSE"]

[target]
environment = "roblox"
lib = "src/init.luau"
build_files = ["src"]

[indices]
default = "https://github.com/pesde-pkg/index"

[wally_indices]
default = "https://github.com/UpliftGames/wally-index"

[dependencies]
Future = { name = "every/future", version = "^0.1.0" }
# Signal = { name = "every/signal", version = "^0.1.0" }
# Promise = { wally = "evaera/promise", version = "^4.0.0" }
