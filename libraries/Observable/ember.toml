[package]
name = "every/observable"
version = "0.0.1"
description = "Observable follows a set of things that come and go, and hands out a Brio for each while it is there."
authors = []
repository = "every-luau/every"
license = "MIT"

[target]
environment = "shared"
main = "src/init.luau"
includes = ["src", "default.project.json", "README.md", "LICENSE"]

[dependencies]
Brio = { name = "every/brio", version = "^0.0.1" }
Connection = { name = "every/connection", version = "^0.0.1" }
Stream = { name = "every/stream", version = "^0.0.1" }
Thread = { name = "every/thread", version = "^0.0.1" }
Void = { name = "every/void", version = "^0.0.1" }

[tools]
lest = "lest-luau/lest@0.6.0"
rojo = "rojo-rbx/rojo@7.7.0"

[scripts]
test = "lest"
