[package]
name = "every/observable"
version = "0.1.0"
description = "A reactive stream of values to subscribe to, map, filter and dedupe."
authors = []
repository = "every-luau/every"
license = "MIT"

[target]
environment = "shared"
main = "src/init.luau"
includes = ["src", "default.project.json", "README.md", "LICENSE"]

[dependencies]
Connection = { name = "every/connection", version = "^0.1.0" }
Signal = { name = "every/signal", version = "^0.1.0" }
Void = { name = "every/void", version = "^0.1.0" }

[tools]
lest = "lest-luau/lest@0.6.0"
rojo = "rojo-rbx/rojo@7.7.0"

[scripts]
test = "lest"
