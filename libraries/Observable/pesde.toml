name = "every/observable"
version = "0.1.0"
description = "A reactive stream of values to subscribe to, map, filter and dedupe."
authors = []
repository = "https://github.com/every-luau/every"
license = "MIT"
includes = ["src", "default.project.json", "pesde.toml", "README.md", "LICENSE"]

[target]
environment = "roblox"
lib = "src/init.luau"
build_files = ["src"]

[indices]
default = "https://github.com/pesde-pkg/index"

[wally_indices]
default = "https://github.com/UpliftGames/wally-index"

[dependencies]
Connection = { name = "every/connection", version = "^0.1.0" }
Void = { name = "every/void", version = "^0.1.0" }
# Signal = { name = "every/signal", version = "^0.1.0" }
# Promise = { wally = "evaera/promise", version = "^4.0.0" }
