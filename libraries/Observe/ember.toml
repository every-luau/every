[package]
name = "every/observe"
version = "0.0.1"
description = "Observe hands out a Brio for every player, character, instance, tag or value, now and later."
authors = []
repository = "every-luau/every"
license = "MIT"

[target]
environment = "shared"
main = "src/init.luau"
includes = ["src", "default.project.json", "README.md", "LICENSE"]

[dependencies]
Observable = { name = "every/observable", version = "^0.0.1" }
Stream = { name = "every/stream", version = "^0.0.1" }
Void = { name = "every/void", version = "^0.0.1" }

[tools]
lest = "lest-luau/lest@0.6.0"
rojo = "rojo-rbx/rojo@7.7.0"

[scripts]
test = "lest"
