name = "nall/region"
version = "0.1.0"
description = "A box that reports what enters and leaves it, every frame, without physics queries."
authors = []
repository = "https://github.com/not-another-luau-lib/region"
license = "MIT"
includes = ["src", "default.project.json", "pesde.toml", "README.md", "LICENSE"]

[target]
environment = "roblox"
lib = "src/init.luau"
build_files = ["src"]

[indices]
default = "https://github.com/pesde-pkg/index"

[wally_indices]
default = "https://github.com/UpliftGames/wally-index"

[dependencies]
Connection = { name = "nall/connection", version = "^0.1.0" }
Loop = { name = "nall/loop", version = "^0.1.0" }
Observe = { name = "nall/observe", version = "^0.1.0" }
Signal = { name = "nall/signal", version = "^0.1.0" }
Thread = { name = "nall/thread", version = "^0.1.0" }
Void = { name = "nall/void", version = "^0.1.0" }
Volume = { name = "nall/volume", version = "^0.1.0" }
# Signal = { name = "nall/signal", version = "^0.1.0" }
# Promise = { wally = "evaera/promise", version = "^4.0.0" }
