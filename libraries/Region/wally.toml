[package]
name = "every/region"
version = "0.1.0"
description = "A box that reports what enters and leaves it, every frame, without physics queries."
authors = []
repository = "https://github.com/every-luau/every"
license = "MIT"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
include = ["src", "default.project.json", "wally.toml", "README.md", "LICENSE"]

[dependencies]
Connection = "every/connection@^0.1.0"
Loop = "every/loop@^0.1.0"
Observe = "every/observe@^0.1.0"
Signal = "every/signal@^0.1.0"
Thread = "every/thread@^0.1.0"
Void = "every/void@^0.1.0"
Volume = "every/volume@^0.1.0"
