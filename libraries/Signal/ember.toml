[package]
name = "every/signal"
version = "0.0.1"
description = "Signal is a yield-safe signal whose handlers run on a recycled thread."
authors = []
repository = "every-luau/every"
license = "MIT"

[target]
environment = "shared"
main = "src/init.luau"
includes = ["src", "default.project.json", "README.md", "LICENSE"]

[dependencies]
Thread = { name = "every/thread", version = "^0.0.1" }
Connection = { name = "every/connection", version = "^0.0.1" }
# Signal = { name = "every/signal", version = "^0.0.1" }

[tools]
lest = "lest-luau/lest@0.6.0"
rojo = "rojo-rbx/rojo@7.7.0"

[scripts]
test = "lest"
