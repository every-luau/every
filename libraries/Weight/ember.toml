[package]
name = "every/weight"
version = "0.1.0"
description = "Picks random keys from a table of weights, with an optional luck factor."
authors = []
repository = "every-luau/every"
license = "MIT"

[target]
environment = "shared"
main = "src/init.luau"
includes = ["src", "default.project.json", "README.md", "LICENSE"]

[indices]
wally = "https://github.com/UpliftGames/wally-index"

[dependencies]
Cryptography = { name = "daily3014/cryptography", version = "^3.1.4", index = "wally" }
# Signal = { name = "every/signal", version = "^0.1.0" }

[tools]
lest = "lest-luau/lest@0.6.0"
rojo = "rojo-rbx/rojo@7.7.0"

[scripts]
test = "lest"
