name = "every/weight"
version = "0.1.0"
description = "Picks random keys from a table of weights, with an optional luck factor."
authors = []
repository = "https://github.com/every-luau/every"
license = "MIT"
includes = ["src", "default.project.json", "pesde.toml", "README.md", "LICENSE"]

[target]
environment = "roblox"
lib = "src/init.luau"
build_files = ["src"]

[indices]
default = "https://github.com/pesde-pkg/index"

[wally_indices]
default = "https://github.com/UpliftGames/wally-index"

[dependencies]
Cryptography = { name = "daily3014/cryptography", version = "^3.1.4", target = "luau" }
